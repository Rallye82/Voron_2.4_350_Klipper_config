# Config backup to GitHub - adds a BACKUP_CFG button in Mainsail
[gcode_shell_command backup_cfg]
command: /home/biqu/printer_data/config/autocommit-config.sh
timeout: 60.
verbose: True

[gcode_macro BACKUP_CFG]
description: Commit and push the printer config to GitHub
gcode:
    RESPOND MSG="Backing up config to GitHub..."
    RUN_SHELL_COMMAND CMD=backup_cfg
