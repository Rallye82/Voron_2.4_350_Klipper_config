#####################################################################
# 	Print Start
#####################################################################
[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  ; Homing
  _STATUS_HOMING
  G90
  G28
  BED_MESH_CLEAR

  ; Oppvarming av bed med soak basert på temperatur
  {% if params.BED|int > 80 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c (ABS/ASA)"
    _STATUS_HEATING
    M106 S255                                    ; PT-fan for kammeroppvarming
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}                           ; Vent til bed er varm
    ;SET_DISPLAY_TEXT MSG="Soak: 10min (ABS/ASA)"
    ;G4 P60000                                    ; Vent 10 minutter
    SET_DISPLAY_TEXT MSG="Venter pa kammer: {target_chamber}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor Print_head" MINIMUM={target_chamber}

  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c (PLA/PETG)"
    _STATUS_HEATING
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}                           ; Vent til bed er varm
    SET_DISPLAY_TEXT MSG="Soak: 3min (PLA/PETG)"
    G4 P180000                                   ; Vent 3 minutter

  {% endif %}

  ; Varm nozzle til 150c for korrekt Z-home
  SET_DISPLAY_TEXT MSG="Hotend: 150c"
  _STATUS_HEATING
  M109 S150

  ; Rens nozzle før kalibrering
  SET_DISPLAY_TEXT MSG="Renser nozzle"
  CLEAN_NOZZLE

  ; QGL
  SET_DISPLAY_TEXT MSG="QGL"
  _STATUS_LEVELING
  QUAD_GANTRY_LEVEL
  G28 Z
  CLEAN_NOZZLE

  ; Adaptivt bed mesh via KAMP
  SET_DISPLAY_TEXT MSG="Bed mesh"
  _STATUS_MESHING
  BED_MESH_CALIBRATE

  ; Parker nær print-området mens nozzle varmes opp
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  _STATUS_HEATING
  SMART_PARK                                     ; KAMP parker nær print-området
  M107                                           ; Skru av PT-fan
  M109 S{target_extruder}                        ; Vent til print-temperatur

  ; KAMP purge og start print
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  _STATUS_PRINTING
  LINE_PURGE                                     ; KAMP adaptiv purge-linje

#####################################################################
# 	Print End
#####################################################################
[gcode_macro PRINT_END]
gcode: 
    M400                            ; Vent til bevegelseskø er tom
    G92 E0                          ; Reset extruder
    G1 E-5.0 F3600                  ; Retrakt filament

    M140 S0                         ; Skru av bed
    M104 S0                         ; Skru av extruder
    M107                            ; Skru av kjølevifte

    G91                             ; Relativ posisjonering
    G0 Z10 F3000                    ; Løft nozzle 10mm
    G0 X20 Y20 F2000                ; Flytt litt unna print (stringing)
    G90                             ; Absolut posisjonering
    G0 X330 Y330 F5000              ; Parker bak til høyre

    BED_MESH_CLEAR                  ; Nullstill bed mesh
    _STATUS_READY                   ; Stealthburner: klar-modus
    M84                             ; Skru av motorer

#####################################################################
# 	G32
#####################################################################
[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28    
    G0 X175 Y175 Z30 F3600

#####################################################################
# 	Nozzle clean
#####################################################################
[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set brush_x = 280 %}           ; ← Juster til børstens X-posisjon
    {% set brush_y = 349 %}           ; ← Juster til børstens Y-posisjon
    {% set brush_z = 3 %}             ; ← Høyde over børsten (start litt høyt)
    {% set wipes = 5 %}               ; Antall frem/tilbake-bevegelser

    _STATUS_CLEANING
    G90                               ; Absolut posisjonering
    G1 Z10 F3000                      ; Løft nozzle før forflytning
    G1 X{brush_x} Y{brush_y} F10000   ; Flytt til børsten

    G1 Z{brush_z} F1000               ; Senk ned til børsten

    {% for i in range(wipes) %}
        G1 X{brush_x + 30} F8000      ; Børst frem
        G1 X{brush_x} F8000           ; Børst tilbake
    {% endfor %}

    G1 Z10 F3000                      ; Løft opp igjen
    _STATUS_LEVELING

#####################################################################
# 	Stealtburner LED Macros
#####################################################################
# The following status macros are available
#
#    STATUS_READY
#    STATUS_OFF
#    STATUS_BUSY
#    STATUS_HEATING
#    STATUS_LEVELING
#    STATUS_HOMING
#    STATUS_CLEANING
#    STATUS_MESHING
#    STATUS_CALIBRATING_Z
#
# With additional macros for basic control:
#
#    SET_NOZZLE_LEDS_ON
#    SET_LOGO_LEDS_OFF
#    SET_NOZZLE_LEDS_OFF